<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}WSNE Hiring Hub{% endblock %}</title>
<style>
:root{--ink:#17202a;--mute:#5d6b7a;--line:#dde3ea;--bg:#f5f7fa;--card:#fff;--brand:#0b5cab;--ok:#18794e;--warn:#9a6700;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
header b{font-size:16px;margin-right:8px}
header a{color:#cfe0f5;text-decoration:none;font-size:14px}
header a:hover{color:#fff}
header .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 14px}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 10px}
a{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e8edf3;color:var(--mute);white-space:nowrap}
.pill.shortlist,.pill.shortlisted,.pill.joined{background:#dff3e8;color:var(--ok)}
.pill.pending,.pill.invited,.pill.assessed,.pill.hold{background:#fdf1d3;color:var(--warn)}
.pill.not_suitable,.pill.rejected{background:#fde4e1;color:var(--bad)}
.big{font-size:26px;font-weight:700;line-height:1.1}
.mute{color:var(--mute);font-size:13px}
.msg{background:#e7f1fb;border:1px solid #b9d4f1;padding:9px 12px;border-radius:8px;margin-bottom:14px}
form.inline{display:inline}
input,select,textarea,button{font:inherit;padding:7px 9px;border:1px solid #b9c3cf;border-radius:7px;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%}
button,.btn{background:var(--brand);color:#fff;border-color:var(--brand);cursor:pointer;text-decoration:none;display:inline-block;padding:7px 12px;border-radius:7px;font-size:14px}
button.ghost,.btn.ghost{background:#fff;color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
pre{white-space:pre-wrap;background:#f1f4f8;padding:10px;border-radius:8px;font-size:13px;margin:6px 0}
audio{width:100%;margin:6px 0}
</style>
</head>
<body>
{% block header %}
<header>
  <b>WSNE Hiring Hub</b>
  <a href="/">Dashboard</a><a href="/candidates">Candidates</a><a href="/intake">Add candidates</a><a href="/roles">Roles</a><a href="/export.csv">Export</a>
  <span class="tools">{% for label, url in tools %}<a href="{{ url }}" target="_blank" rel="noopener">{{ label }} ↗</a>{% endfor %}</span>
</header>
{% endblock %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
