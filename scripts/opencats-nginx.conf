server {
    listen 80;
    root /var/www/public;
    index index.php;
    client_max_body_size 25m;

    # Never serve backups, config or internals directly.
    location ~* /attachments/(.*/)?catsbackup\.(bak|sql(\.[0-9]+)?)$ { return 403; }
    location ~ /(\.git|vendor|test|docker|db|scripts|lib)/ { return 403; }
    location ~ /\. { return 403; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass opencats-php:9000;
        fastcgi_read_timeout 120s;
    }
}
